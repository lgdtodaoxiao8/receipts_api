name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: receipts_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:secret@localhost:5433/receipts_test
        run: alembic upgrade head

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Type check
        run: mypy .

      - name: Tests
        run: pytest