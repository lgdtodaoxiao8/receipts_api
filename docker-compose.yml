services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: receipts
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      
  test_db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: receipts_test
    ports:
      - "5433:5432"
  
  cache_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db_data: